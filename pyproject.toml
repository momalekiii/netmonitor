[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmonitor"
version = "1.1.0"
description = "24/7 cross-platform CLI daemon for monitoring network sockets, ports, adapters, VPNs, GeoIP, IP/domain details with Discord & Telegram webhooks, log export, and backups."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Arena.ai Agent", email = "agent@arena.ai" }]
license = { text = "MIT" }
keywords = [
    "network", "monitoring", "sockets", "ports", "cli", "daemon",
    "geoip", "vpn", "discord", "telegram", "netstat", "systemd", "docker",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "typer[all]>=0.9.0",
    "requests>=2.28.0",
    "python-whois>=0.7.3",
    "dnspython>=2.3.0",
    "colorama>=0.4.5",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
netmonitor = "netmonitor.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["netmonitor*"]
